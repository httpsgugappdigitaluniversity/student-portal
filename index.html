<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Portal Login</title>

<style>
body{
    margin:0;
    background:#e5e5e5;
    font-family:Arial, sans-serif;
}

.header{
    background:white;
    width:95%;
    margin:20px auto 0;
    border:1px solid #ccc;
}

.logo{
    padding:20px;
    font-size:34px;
    font-weight:bold;
    color:#d67c00;
}

.sub{
    color:#666;
    font-size:13px;
}

.bar{
    height:25px;
    background:linear-gradient(#9d9d9d,#5e5e5e);
}

.login-title{
    width:95%;
    margin:auto;
    background:white;
    border-left:1px solid #ccc;
    border-right:1px solid #ccc;
    padding:15px;
    color:#8b0000;
    font-size:30px;
    font-weight:bold;
}

.content{
    width:95%;
    margin:auto;
    background:white;
    min-height:400px;
    border:1px solid #ccc;
}

.box{
    width:380px;
    margin:80px auto;
    border:1px solid #ccc;
    padding:30px;
}

.row{
    margin:15px 0;
}

label{
    display:inline-block;
    width:130px;
    font-weight:bold;
}

input{
    width:200px;
    padding:6px;
    border:2px solid #c44;
}

button{
    margin-left:135px;
    padding:7px 30px;
}

.footer{
    text-align:center;
    color:#666;
    padding:20px;
    font-size:12px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">
        Student Portal
        <div class="sub">Demo Practice Website</div>
    </div>
    <div class="bar"></div>
</div>

<div class="login-title">
    Login here
</div>

<div class="content">

<div class="box">

<div class="row">
<label>PRN / UserName</label>
<input type="text" id="user">
</div>

<div class="row">
<label>Password</label>
<input type="password" id="pass">
</div>

<button onclick="login()">Login</button>

</div>

<div class="footer">
Copyright 2026 | Student Portal
</div>

</div>

<script>
function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="2019033700023202" && p==="Pass@190600"){
    alert("Login Successful");
}else{
    alert("Wrong Username or Password");
}

}
</script>

</body>
</html>
